[workspace]
members = ["crates/poke-around"]
resolver = "3"

[workspace.package]
version = "0.3.9"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/undivisible/poke-around"

[workspace.dependencies]
base64 = "0.22"
ctrlc = "3.4"
dirs = "6.0"
rand = "0.9"
rs_peekaboo = "0.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
