[workspace]
members = ["crates/poke-around"]
resolver = "3"

[workspace.package]
version = "0.6.3"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/undivisible/poke-around"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3.4"
dirs = "6.0"
fs2 = "0.4"
atomicwrites = "0.4.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rs_poke = "0.2.4"
rs_peekaboo = "0.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.45", features = ["rt-multi-thread", "sync", "time"] }
shlex = "2.0.1"
url = "2.5"
