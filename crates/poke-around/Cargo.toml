[package]
name = "poke-around"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Expose your machine to Poke through a Rust MCP daemon"
keywords = ["poke", "mcp", "tunnel", "automation", "remote"]
categories = ["command-line-utilities"]

[[bin]]
name = "poke-around"
path = "src/main.rs"

[dependencies]
atomicwrites.workspace = true
chrono.workspace = true
ctrlc.workspace = true
dirs.workspace = true
fs2.workspace = true
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
rand.workspace = true
reqwest.workspace = true
rs_poke.workspace = true
rs_peekaboo.workspace = true
praefectus = "=0.8.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
futures = "0.3.32"
sha2 = "0.10"

[dev-dependencies]
serial_test = "3.5.0"
rustix = { version = "0.38", features = ["std", "net"] }
tempfile = "3.23"
libc = "0.2"
httptest = "0.16.4"
