name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"

jobs:
  cargo_deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce advisory exception expiry
        run: |
          python3 - <<'PY'
          import datetime
          import re
          import tomllib

          with open('deny.toml', 'rb') as config:
              ignores = tomllib.load(config).get('advisories', {}).get('ignore', [])
          today = datetime.datetime.now(datetime.timezone.utc).date()
          for ignore in ignores:
              reason = ignore.get('reason', '') if isinstance(ignore, dict) else ''
              match = re.match(r'^Expires (\d{4}-\d{2}-\d{2}): .+', reason)
              if not match or datetime.date.fromisoformat(match.group(1)) <= today:
                  raise SystemExit(f'Advisory exception missing a future expiry or expired: {ignore}')
          PY
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          deny-version: 0.20.2

  build_and_test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Typecheck
        run: cargo check --workspace --all-targets --all-features

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Test approval prompt thread bound
        if: runner.os == 'Linux'
        run: script -q -e -c 'cargo test invalidated_approvals_do_not_accumulate_prompt_threads -- --test-threads=1' /dev/null

      - name: Install script test
        if: runner.os != 'Windows'
        run: bash scripts/test-install.sh

      - name: Install script test
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/test-install.sh

      - name: Build
        run: cargo build --workspace --release
