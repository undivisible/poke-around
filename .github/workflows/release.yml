name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Run tests before anything else — block the release if they fail
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install bridge dependencies
        run: bun install
        working-directory: bridge

      - name: Build bridge
        run: bun run build:bridge

      - name: Test bridge
        run: bun run test:bridge

      - name: Format
        run: cargo fmt --all -- --check

      - name: Typecheck
        run: cargo check --workspace --all-targets --all-features

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Install script test
        run: bash scripts/test-install.sh

  # Build the bridge JS once (platform-independent)
  bridge:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install bridge deps
        run: bun install
        working-directory: bridge

      - name: Bundle bridge
        run: bun run build:bridge

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-js
          path: bridge/dist

  # Build native binary per platform
  build:
    needs: bridge
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos-aarch64
            rust_target: aarch64-apple-darwin
          - os: macos-15-intel
            name: macos-x86_64
            rust_target: x86_64-apple-darwin
          - os: ubuntu-latest
            name: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            rust_target: aarch64-unknown-linux-gnu
          - os: windows-latest
            name: windows-x86_64
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: actions/download-artifact@v4
        with:
          name: bridge-js
          path: bridge/dist

      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.rust_target }}

      - name: Package
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.rust_target }}/release/poke-around dist/
          cp -R bridge/dist/. dist/
          tar -czf poke-around-${{ matrix.name }}.tar.gz -C dist .

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/${{ matrix.rust_target }}/release/poke-around.exe dist/
          Copy-Item bridge/dist/* dist/ -Recurse
          Compress-Archive -Path dist/* -DestinationPath poke-around-${{ matrix.name }}.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: poke-around-${{ matrix.name }}.*

  # Create GitHub release and update homebrew tap
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "poke-around ${{ github.ref_name }}" \
            --generate-notes \
            release-assets/*
