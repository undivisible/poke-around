[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "Expires 2027-02-05: praefectus 0.8.0 and atspi 0.30 require zbus 5 and its zvariant crate; migrate when upstream supports zbus 6." },
    { id = "RUSTSEC-2026-0371", reason = "Expires 2027-02-05: praefectus 0.8.0 and atspi 0.30 require zbus 5 and its zbus_names crate; migrate when upstream supports zbus 6." },
    { id = "RUSTSEC-2026-0372", reason = "Expires 2027-02-05: praefectus 0.8.0 and atspi 0.30 require zbus 5 and its zvariant_derive crate; migrate when upstream supports zbus 6." },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
